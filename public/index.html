<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ORCA Console</title>
  <meta name="description" content="ORCA – AI agent orchestrator for software testing">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b82f6'/%3E%3Cpath d='M8 18c3-7 13-9 17-3-3 0-5 2-6 4-4 1-8 1-11-1z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent-2)"/><path d="M8 18c3-7 13-9 17-3-3 0-5 2-6 4-4 1-8 1-11-1z" fill="#fff"/></svg>
        <div><strong>ORCA</strong><small>QA agent orchestrator</small></div>
        <button class="icon-btn menu-close" id="menu-close" aria-label="Close menu"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      </div>
      <nav id="nav" aria-label="Main">
        <a href="#/overview" data-route="overview">Overview</a>
        <a href="#/approvals" data-route="approvals">Approvals <span class="badge" id="approval-badge" hidden>0</span></a>
        <a href="#/jira" data-route="jira">Jira tickets</a>
        <a href="#/runs" data-route="runs">Runs</a>
        <span class="nav-group">Results</span>
        <a href="#/reports" data-route="reports">QA reports</a>
        <a href="#/tests" data-route="tests">Test results</a>
        <a href="#/investigations" data-route="investigations">Failure analysis</a>
        <a href="#/trace" data-route="trace">Traceability</a>
        <span class="nav-group">System</span>
        <a href="#/deployments" data-route="deployments">Environments &amp; CI</a>
      </nav>
      <div class="sidebar-foot">
        <span class="conn" id="conn" data-state="connecting">connecting…</span>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-open" id="menu-open" aria-label="Open menu"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
        <h1 id="page-title">Overview</h1>
        <div class="topbar-right" id="topbar-right"></div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="drawer" class="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <div class="drawer-backdrop" data-close></div>
    <div class="drawer-panel">
      <div class="drawer-head"><h2 id="drawer-title"></h2><button class="icon-btn" data-close aria-label="Close"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></div>
      <div class="drawer-body" id="drawer-body"></div>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
